<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160d2b">
  <meta name="description" content="Aplikacja PWA do śledzenia inicjatywy w D&D.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>D&D Initiative Tracker</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="symbol" aria-hidden="true">⚔️</div>
      <h1>D&D Initiative Tracker</h1>
      <p>Śledź kolejność tur w walce. Kafelki sortują się według inicjatywy.</p>
    </header>

    <section class="toolbar" aria-label="Główne akcje">
      <button id="addButton" class="primary-button" type="button">+ Dodaj wroga</button>
      <div class="round-pill" aria-live="polite">Runda <strong id="roundNumber">1</strong></div>
      <button id="resetButton" class="secondary-button" type="button">Reset</button>
    </section>

    <section id="combatantList" class="combatant-list" aria-live="polite"></section>

    <p class="hint">
      Nowy kafelek pozostaje na górze do zakończenia edycji. Biała ramka wskazuje aktualną turę.
    </p>

    <template id="emptyTemplate">
      <article class="empty-state">
        <h2>Brak aktywnych uczestników</h2>
        <p>Dodaj wroga albo użyj resetu, aby przywrócić postacie graczy.</p>
      </article>
    </template>

    <footer>
      <p>Wersja testowa v5 — zapis lokalny przez localStorage.</p>
    </footer>
  </main>

  <noscript>Ta aplikacja wymaga włączonego JavaScriptu.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
